name: icce

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-501}
        GID: ${GID:-20}
    image: icce/php:8.4-fpm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-icce.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Se publican los dos: 80 da la URL limpia, 8080 queda como respaldo
      # por si el puerto 80 del host ya está ocupado.
      - "${APP_PORT:-80}:80"
      - "${APP_PORT_ALT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.8
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-icce}
      MARIADB_USER: ${DB_USERNAME:-icce}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles: ["dev"]

volumes:
  dbdata:
  redisdata:
